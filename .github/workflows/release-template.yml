name: Release open resources

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release with CSV assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            resources/backlink-evidence-log.csv
            lists/starter-directories.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
