name: Directory link check

on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify starter directory URLs
        run: python3 scripts/site_maintenance.py check-links

      - name: Regenerate sitemap and changelog
        run: |
          python3 scripts/site_maintenance.py generate-sitemap
          python3 scripts/site_maintenance.py render-changelog

      - name: Commit and push if changed
        run: |
          git config user.name "nettree-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/starter-directories.csv docs/sitemap.xml docs/changelog.html
          if git diff --staged --quiet; then
            echo "No link status changes."
          else
            git commit -m "chore: verify starter directory links $(date -u +%Y-%m-%d)"
            git push
          fi
