name: Weekly freshness update

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run weekly freshness
        run: python3 scripts/site_maintenance.py weekly-freshness

      - name: Commit and push if changed
        run: |
          git config user.name "nettree-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sitemap.xml docs/changelog.html lists/starter-directories.csv data/changelog.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly freshness update $(date -u +%Y-%m-%d)"
            git push
          fi
